user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ocultar versão do Nginx (Information Disclosure)
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Permitir uploads grandes (vídeos, zips, ISOS)
    client_max_body_size 0;

    # Zonas de Rate Limiting calibradas (Proteção sem bloquear navegação rápida legítima)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=40r/s;
    limit_req_status 429;

    # Cabeçalhos Globais de Segurança (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip para HTML, CSS e JS
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        # Bloquear arquivos ocultos (.env, .git, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Bloquear acesso direto a arquivos de banco ou código-fonte
        location ~* \.(sqlite3|db|py|sh|env|bak|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Favicon direto do Nginx
        location ~* ^/favicon\.(ico|svg)$ {
            alias /app/staticfiles/favicon.svg;
            expires 30d;
            access_log off;
            log_not_found off;
        }

        # Arquivos estáticos do Django (CSS, JS, Ícones)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Localizações protegidas internas (apenas via X-Accel-Redirect do Django)
        location ~ ^/_protected/uploads?/(.*)$ {
            internal;
            alias /app/storage/uploads/$1;
            sendfile on;
            sendfile_max_chunk 1m;
            tcp_nopush on;
            tcp_nodelay on;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ ^/_protected/external/(.*)$ {
            internal;
            alias /app/storage/external/$1;
            sendfile on;
            sendfile_max_chunk 1m;
            tcp_nopush on;
            tcp_nodelay on;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Rota de login (tolerância calibrada para navegação normal e troca de idioma)
        location /auth/login/ {
            limit_req zone=login_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Accel-Supported "1";
            proxy_redirect off;
        }

        # Rate Limit em downloads e streaming direto
        location ~ ^/(d|s)/ {
            limit_req zone=download_limit burst=30 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Accel-Supported "1";
            proxy_redirect off;

            proxy_read_timeout 1800s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_request_buffering off;
        }

        # Proxy reverso para o Gunicorn (Django)
        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Accel-Supported "1";
            proxy_redirect off;

            # Otimizações para upload de grandes arquivos
            proxy_read_timeout 1800s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_request_buffering off;
        }
    }
}
